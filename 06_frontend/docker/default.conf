# La app vive bajo /newapp/ igual que en el gateway: YARP no quita el prefijo.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Detrás de nginx + gateway: redirecciones relativas, sin el host interno del contenedor
    absolute_redirect off;

    # Generado al arrancar por 40-newapp-config.sh (CSP con el origen de Keycloak)
    include /var/lib/newapp/seguridad.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /newapp {
        return 301 /newapp/;
    }

    # Cambia por ambiente sin cambiar de nombre: nunca de caché
    location = /newapp/config.json {
        alias /var/lib/newapp/config.json;
        default_type application/json;
        include /var/lib/newapp/seguridad.conf;
        add_header Cache-Control "no-store" always;
    }

    # index.html apunta a los archivos con hash de cada build: se revalida siempre
    location = /newapp/index.html {
        include /var/lib/newapp/seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    # outputHashing: all → cada build cambia el nombre de js y css
    location ~* ^/newapp/.+\.(?:js|css)$ {
        include /var/lib/newapp/seguridad.conf;
        # Sin "always": un 404 no se cachea
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas de Angular (/newapp/menu, /newapp/legfrontnewback, ...): las resuelve el router
    location /newapp/ {
        try_files $uri /newapp/index.html;
    }

    location / {
        return 404;
    }
}
