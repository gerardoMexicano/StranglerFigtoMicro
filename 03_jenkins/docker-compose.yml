version: '3.8'

services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    environment:
      # JCasC interpola ${JENKINS_ADMIN_PASSWORD} en casc/jenkins.yaml
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:?Define JENKINS_ADMIN_PASSWORD en .env (ver .template.env.jenkins)}
    user: root
    ports:
      - "${JENKINS_PORT}:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/gerarddebian/Documentos/Proyectos/LAboratorio:/home/gerarddebian/Documentos/Proyectos/LAboratorio
    networks:
      - jenkins_net

volumes:
  jenkins_home:

networks:
  jenkins_net:
