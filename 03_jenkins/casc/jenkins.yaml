jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin123"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  # ─────────────────────────────────────────────
  # NODO MAESTRO: solo corre jobs que no especifiquen agente
  # ─────────────────────────────────────────────
  numExecutors: 2

  # ─────────────────────────────────────────────
  # AGENTES PERMANENTES (JNLP / inbound)
  # Aparecen como "offline" hasta que se conecte
  # el proceso agente en cada máquina
  # ─────────────────────────────────────────────
  nodes:
    - permanent:
        name: "agente-linux-01"
        labelString: "linux docker"
        remoteFS: "/home/jenkins"
        numExecutors: 2
        mode: EXCLUSIVE
        retentionStrategy: "always"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false
              internalDir: "remoting"

    - permanent:
        name: "agente-linux-02"
        labelString: "linux build"
        remoteFS: "/home/jenkins"
        numExecutors: 2
        mode: EXCLUSIVE
        retentionStrategy: "always"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false
              internalDir: "remoting"

    - permanent:
        name: "agente-windows-01"
        labelString: "windows"
        remoteFS: "C:\\Jenkins"
        numExecutors: 2
        mode: EXCLUSIVE
        retentionStrategy: "always"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false
              internalDir: "remoting"

jobs:
  - file: /var/jenkins_home/jobsasc/saludo-job.groovy
  - file: /var/jenkins_home/jobsasc/demo-deploy.groovy
  - file: /var/jenkins_home/jobsasc/mi-job-ejemplo.groovy