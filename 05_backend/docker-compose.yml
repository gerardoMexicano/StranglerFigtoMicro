# ==============================================================================
# Stack independiente: 05_backend (.NET 10 Clean Architecture — Kestrel sin IIS)
#
# Reutiliza las variables por ambiente de 07_reverse/01_deployment/.env.<ambiente>:
#   docker network create backend   (si aún no existe en el host)
#   docker compose --env-file ../07_reverse/01_deployment/.env.development up -d --build
#   docker compose --env-file ../07_reverse/01_deployment/.env.testing     up -d --build
#   docker compose --env-file ../07_reverse/01_deployment/.env.production  up -d --build
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME:?Define COMPOSE_PROJECT_NAME en el env file}-backend

services:
  backend-api:
    image: backend-api:${APP_ENV:?Define APP_ENV en el env file}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Entorno de ejecución (.NET 10 Kestrel)
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      TZ: ${TZ:-America/Mexico_City}

      # Contrato OIDC con Keycloak (mismo esquema que 07_reverse/01_deployment)
      # - Authority: issuer público esperado en el claim "iss" del JWT
      # - MetadataAddress: discovery OIDC por la red interna Docker "backend"
      # - Audience: cliente resource server esperado en el claim "aud"
      Oidc__Authority: ${KC_HOSTNAME:?Define KC_HOSTNAME}/realms/${KC_REALM:?Define KC_REALM}
      Oidc__MetadataAddress: http://keycloak:8080${KC_HTTP_RELATIVE_PATH}/realms/${KC_REALM}/.well-known/openid-configuration
      Oidc__Audience: ${KC_API_CLIENT_ID:-backend-api}
      Oidc__RequireHttpsMetadata: "false"

      # Cadenas de conexión SQL Server (Dapper)
      ConnectionStrings__DefaultConnection: ${BACKEND_DB_CONNECTION:-${LEGACY_DB_CONNECTION:?Define LEGACY_DB_CONNECTION o BACKEND_DB_CONNECTION en el env file}}
      ConnectionStrings__WideWorldImporters: ${WWI_DB_CONNECTION:?Define WWI_DB_CONNECTION en el env file}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'Healthy' <&3
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

networks:
  backend:
    name: backend
    external: true
