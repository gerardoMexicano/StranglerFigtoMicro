events {
    worker_connections 1024;
}

http {
    # Redirigir al nuevo backend (.NET 10)
    upstream new_api {
        # TODO: Ajustar el puerto y host cuando se definan los contenedores
        server host.docker.internal:5000; 
    }

    # Redirigir al monolito legacy
    upstream legacy_api {
        # TODO: Ajustar a la IP/host real del IIS o servidor legacy
        server host.docker.internal:8080; 
    }

    server {
        listen 80;

        # Regla Strangler Fig: interceptar el módulo migrado (Reportes/Menú)
        location /api/v1/reportes {
            proxy_pass http://new_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        location /api/v1/menu {
            proxy_pass http://new_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Fallback: El resto del tráfico va al monolito legacy
        location / {
            proxy_pass http://legacy_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
